name: Build, validate and publish site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install Pillow
      - run: npm run build
      - run: npm test
      - name: Validate media references & catalog assets
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('assets/catalog-data.json'));c.forEach(x=>{const img=x.image.replace(/^\//,'');if(!fs.existsSync(img))throw new Error('Missing catalog media: '+x.image);});console.log('Validated '+c.length+' catalog image paths successfully');"
      - run: python scripts/package-site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish validated build
        id: deployment
        uses: actions/deploy-pages@v4
